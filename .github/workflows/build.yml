name: Build Otzaria 3D logo
on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install numpy trimesh shapely pillow
      - name: Download original logo
        run: |
          mkdir -p assets
          curl --fail --location --retry 3 --silent --show-error 'https://otzaria.org/forum/assets/uploads/system/site-logo.png' -o assets/site-logo.png
          file assets/site-logo.png
      - name: Validate source image
        run: |
          python - <<'PY'
          from PIL import Image
          im=Image.open('assets/site-logo.png')
          im.verify()
          print('Source image OK')
          PY
      - name: Build 3D formats
        run: python scripts/build.py
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/site-logo.png models/
          if ! git diff --cached --quiet; then
            git commit -m "Build 3D logo files and add reference image"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: otzaria-logo-3d
          path: |
            models/*.glb
            models/*.stl
            assets/site-logo.png
